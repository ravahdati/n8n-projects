<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>n8n Projects</title>
  <meta name="description" content="Collection of n8n workflows – نمونه پروژه‌های n8n">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23ff6d5a'/><circle cx='9' cy='16' r='3' fill='white'/><circle cx='23' cy='9' r='3' fill='white'/><circle cx='23' cy='23' r='3' fill='white'/><path d='M12 16 20 9.5M12 16l8 6.5' stroke='white' stroke-width='2'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    // apply saved theme/lang before paint (avoids flash)
    try {
      var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      var l = localStorage.getItem('lang') || 'fa';
      document.documentElement.dataset.theme = t;
      document.documentElement.lang = l;
      document.documentElement.dir = l === 'fa' ? 'rtl' : 'ltr';
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22"><circle cx="8" cy="16" r="3.2" fill="currentColor"/><circle cx="24" cy="8" r="3.2" fill="currentColor"/><circle cx="24" cy="24" r="3.2" fill="currentColor"/><path d="M11 15 21 9M11 17l10 6" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      </span>
      <span data-i18n="siteName">پروژه‌های n8n</span>
    </a>
    <div class="actions">
      <button id="langBtn" class="pill" type="button" aria-label="Language">EN</button>
      <button id="themeBtn" class="pill" type="button" aria-label="Theme">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main id="app" class="wrap" aria-live="polite"></main>

  <footer class="footer wrap">
    <span data-i18n="footer">ساخته‌شده با n8n</span>
    <a id="repoLink" href="https://github.com/ravahdati/n8n-projects" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@webcomponents/webcomponentsjs@2.0.0/webcomponents-loader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lit@2/polyfill-support.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@n8n_io/n8n-demo-component/n8n-demo.bundled.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
